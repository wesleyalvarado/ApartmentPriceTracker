server.port=8001

spring.datasource.url=jdbc:sqlite:${DB_PATH:../data/apartments.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.property-naming-strategy=SNAKE_CASE


# Actuator — expose health + info publicly; keep sensitive endpoints internal
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=AptPricing Java API
info.app.description=Apartment price tracker — Dallas TX
info.app.version=1.0.0

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Scraper scheduler
# Path to the scraper/ directory, relative to wherever the JAR is run from
scraper.base-path=${SCRAPER_PATH:../scraper}
# Daily at 8:00 AM local time — override with SCRAPER_CRON env var if needed
scraper.cron=${SCRAPER_CRON:0 0 8 * * *}
